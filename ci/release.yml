name: Test, build and release MarkerPilot

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: robotics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy opencv-python-headless pyserial
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end simulator self-test
        run: python -m markerpilot selftest --trials 4

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: markerpilot-linux-x86_64
          - os: windows-latest
            asset: markerpilot-windows-x86_64.exe
          - os: macos-14
            asset: markerpilot-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: robotics
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller numpy opencv-python-headless PyQt6 pyserial
      - name: Build single-file app
        run: |
          pyinstaller --noconfirm --onefile --name markerpilot --paths . \
            --collect-data markerpilot \
            --hidden-import serial.tools.list_ports \
            --exclude-module tkinter \
            packaging/markerpilot_entry.py
      - name: Smoke test the built app
        run: |
          BIN=dist/markerpilot; [ -f dist/markerpilot.exe ] && BIN=dist/markerpilot.exe
          "$BIN" --version
          "$BIN" selftest --trials 2
      - name: Rename
        run: |
          mkdir -p ../out
          if [ -f dist/markerpilot.exe ]; then cp dist/markerpilot.exe ../out/${{ matrix.asset }}; else cp dist/markerpilot ../out/${{ matrix.asset }}; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Bundle firmware and reports
        run: |
          zip -r artifacts/firmware-all-boards.zip electronics iot robotics/firmware -x "*/build/*"
          cp reports/*.pdf artifacts/
          cp install/install.sh install/install.ps1 artifacts/
          ls -la artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "MarkerPilot ${GITHUB_REF_NAME}" \
            --notes-file install/RELEASE_NOTES.md
